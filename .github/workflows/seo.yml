name: SEO quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify generated SEO pages
        run: python3 seo/generate.py --check
      - name: Run SEO quality checks
        run: python3 tool/check_seo.py
