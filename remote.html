<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Remote Capture | BlackShisa</title>
    <meta name="description" content="Ask the phone that is watching your parked car to take a photo right now. The photo is emailed to you; nothing is stored on our servers.">
    <!-- ⛔ これは利用者ごとの操作画面である。検索結果に出さない。サイトマップにも載せない。 -->

    <link rel="icon" type="image/jpeg" href="assets/img/blackshisa-logo.jpg">
    <link rel="apple-touch-icon" href="assets/img/blackshisa-logo.jpg">
    <meta name="theme-color" content="#030303">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
      :root {
        --bg: #030303;
        --panel: #121214;
        --line: #2a2a2e;
        --fg: #f4f4f5;
        --muted: #a1a1aa;
        --gold: #c8a04a;
        --ok: #4ade80;
        --warn: #fbbf24;
        --bad: #f87171;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans",
          "Noto Sans JP", Roboto, sans-serif;
        line-height: 1.7;
      }
      .wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 64px; }
      header.bar {
        display: flex; align-items: center; gap: 10px;
        padding: 14px 16px; border-bottom: 1px solid var(--line);
      }
      header.bar img { width: 32px; height: 32px; border-radius: 6px; }
      header.bar a { color: var(--fg); text-decoration: none; font-weight: 600; }
      header.bar .spacer { flex: 1; }
      header.bar select {
        background: var(--panel); color: var(--fg);
        border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px;
      }
      h1 { font-size: 1.5rem; margin: 28px 0 8px; }
      p.lead { color: var(--muted); margin-top: 0; }
      .card {
        background: var(--panel); border: 1px solid var(--line);
        border-radius: 14px; padding: 18px; margin: 18px 0;
      }
      .row { display: flex; align-items: center; gap: 10px; }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
      .dot.ok { background: var(--ok); }
      .dot.warn { background: var(--warn); }
      .dot.bad { background: var(--bad); }
      button.shoot {
        width: 100%; padding: 18px; font-size: 1.05rem; font-weight: 700;
        color: #17140c; background: var(--gold); border: 0; border-radius: 12px;
        cursor: pointer;
      }
      button.shoot:disabled { opacity: .45; cursor: not-allowed; }
      .status { margin-top: 14px; min-height: 1.7em; }
      .status.ok { color: var(--ok); }
      .status.bad { color: var(--bad); }
      .status.warn { color: var(--warn); }
      .note { color: var(--muted); font-size: .9rem; }
      .hidden { display: none !important; }
      a.link { color: var(--gold); }
      .signed { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
      button.plain {
        background: transparent; color: var(--muted);
        border: 1px solid var(--line); border-radius: 8px;
        padding: 6px 10px; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header class="bar">
      <a href="./"><img src="assets/img/blackshisa-logo-nav.webp" alt="" width="32" height="32"> BlackShisa</a>
      <span class="spacer"></span>
      <select id="lang" aria-label="Language">
        <option value="en">English</option>
        <option value="ja">日本語</option>
        <option value="de">Deutsch</option>
        <option value="es">Español</option>
      </select>
    </header>

    <main class="wrap">
      <h1 id="t-title">Remote capture</h1>
      <p class="lead" id="t-lead"></p>

      <!-- ログイン前 -->
      <section class="card" id="signin-card">
        <p id="t-signin-help"></p>
        <div id="gbtn"></div>
        <p class="note" id="t-signin-note"></p>
      </section>

      <!-- ログイン後 -->
      <section class="card hidden" id="app-card">
        <div class="signed">
          <span class="note" id="who"></span>
          <button class="plain" id="signout"></button>
        </div>
        <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
        <div class="row"><span class="dot" id="mon-dot"></span><span id="mon-text"></span></div>
        <p class="note" id="mon-sub"></p>
        <button class="shoot" id="shoot" disabled></button>
        <div class="status" id="status"></div>

      <p class="note" id="t-privacy"></p>
      <p class="note"><a class="link" href="./privacy-policy.html" id="t-privacy-link">Privacy policy</a></p>
    </main>

          failCamera: 'Die Kamera war nicht verfügbar.',
          failAuth: 'Die Anfrage wurde nicht akzeptiert.',
          failMail: 'Foto aufgenommen, aber der E-Mail-Versand schlug fehl.',
          failEntitled: 'Das Abonnement ist nicht aktiv.',
          failOther: 'Unbekannter Grund.',
          privacy:
            'Das Foto geht direkt vom überwachenden Telefon an Ihr eigenes Gmail. Es wird nie auf unsere Server geladen oder dort gespeichert.',
          privacyLink: 'Datenschutzerklärung',
        },
        es: {
          title: 'Captura remota',
          lead: 'Pide al teléfono que vigila tu coche que haga una foto ahora mismo.',
          signinHelp: 'Inicia sesión con la misma cuenta de Google que vinculaste en la app.',
          signinNote: 'Solo leemos quién eres. Aquí no leemos tu correo ni tus archivos.',
          signout: 'Cerrar sesión',
          signedAs: 'Sesión iniciada como {email}',
          checking: 'Comprobando el teléfono que vigila…',
          noMonitor: 'No hay ningún teléfono vigilante vinculado a esta cuenta de Google.',
          noMonitorSub: 'Abre la app en el teléfono que dejas en el coche y vincúlalo primero.',
          linked: 'Hay un teléfono vigilante vinculado a esta cuenta.',
          linkedSub: 'Si responde o no, solo se sabe al pedirlo.',
          shoot: 'Hacer una foto ahora',
          sending: 'Enviando la petición…',
          waiting: 'Esperando a que el teléfono haga la foto…',
          captured: 'Listo. La foto va camino de tu correo.',
          capturedPending: 'Foto hecha. Se enviará en cuanto el teléfono vuelva a tener conexión.',
          timeout: 'La app no responde. Puede que la vigilancia no esté activa en el teléfono o que no tenga conexión a internet.',
          errAuth: 'Tu sesión ha caducado. Vuelve a iniciar sesión.',
          errNoMonitor: 'No hay ningún teléfono vigilante vinculado a esta cuenta de Google.',
          errNoToken: 'El teléfono no puede recibir peticiones. Abre la app en él una vez.',
          errSameDevice: 'Este es el propio teléfono vigilante.',
          errRateMinute: 'Demasiadas peticiones. Espera un minuto.',
          errRateDay: 'Has alcanzado el límite diario.',
          errPush: 'No se pudo contactar con el teléfono. Inténtalo en un momento.',
          errNetwork: 'Error de red. Inténtalo de nuevo.',
          errExpired: 'El resultado ha caducado.',
          failPrefix: 'El teléfono no pudo hacer la foto: ',
          failForeground: 'la app no estaba en primer plano.',
          failCamera: 'la cámara no estaba disponible.',
          failAuth: 'la petición no fue aceptada.',
          failMail: 'se hizo la foto, pero falló el envío del correo.',
          failEntitled: 'la suscripción no está activa.',
          failOther: 'motivo desconocido.',
          privacy:
            'La foto se envía desde el teléfono vigilante directamente a tu propio Gmail. Nunca se sube ni se guarda en nuestros servidores.',
          privacyLink: 'Política de privacidad',
        },
      };

      const HTML_LANG = { en: 'en-US', ja: 'ja-JP', de: 'de-DE', es: 'es-ES' };

      /**
       * ⛔ **既定はブラウザの言語設定。** 利用者に選ばせる前に、来た言語で出す。
       * 希望の順に見て、最初に対応しているものを採る（`ja-JP` のような形も拾う）。
       * `?lang=` を付けたときだけ、それが優先される。
       */
      function pickLang() {
        const forced = new URLSearchParams(location.search).get('lang');
        if (forced && I18N[forced]) return forced;
        const wanted = navigator.languages && navigator.languages.length
          ? navigator.languages
          : [navigator.language || 'en'];
        for (const tag of wanted) {
          const code = String(tag).toLowerCase().slice(0, 2);
          if (I18N[code]) return code;
        }
        return 'en';
      }

      let lang = pickLang();
      let T = I18N[lang];
      let idToken = null;
      let email = null;
      let polling = false;

      const $ = (id) => document.getElementById(id);

      function applyLang() {
        T = I18N[lang];
        document.documentElement.lang = HTML_LANG[lang];
        $('lang').value = lang;
        $('t-title').textContent = T.title;
        $('t-lead').textContent = T.lead;
        $('t-signin-help').textContent = T.signinHelp;
        // ⛔ 言語によっては、この 1 行を出さない（空文字のときは行ごと消す）。
        $('t-signin-note').textContent = T.signinNote;
        $('t-signin-note').classList.toggle('hidden', !T.signinNote);
        $('signout').textContent = T.signout;
        $('shoot').textContent = T.shoot;
        $('t-privacy').textContent = T.privacy;
        $('t-privacy-link').textContent = T.privacyLink;
        if (email) $('who').textContent = T.signedAs.replace('{email}', email);
      }

      function setStatus(message, kind) {
        const node = $('status');
        node.textContent = message || '';
        node.className = 'status' + (kind ? ' ' + kind : '');
      }

      function setMonitor(dotClass, text, sub) {
        $('mon-dot').className = 'dot' + (dotClass ? ' ' + dotClass : '');
        $('mon-text').textContent = text;
        $('mon-sub').textContent = sub || '';
      }

      /**
       * 中継を叩く。⛔ **合言葉は `Authorization` の見出しだけで運ぶ。**
       * URL には何も載せない（記録に残るため）。
       */
      async function call(name, body) {
        let response;
        try {
          response = await fetch(BASE + '/' + name, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: 'Bearer ' + idToken,
            },
            body: JSON.stringify(body || {}),
          });
        } catch (error) {
          return { httpStatus: 0, data: null };
        }
        let data = null;
        try {
          data = await response.json();
        } catch (error) {
          data = null;
        }
        return { httpStatus: response.status, data };
      }

      /** ⛔ ログインが切れたら、黙って失敗させずに入口へ戻す。 */
      function requireSignIn() {
        idToken = null;
        email = null;
        $('app-card').classList.add('hidden');
        $('signin-card').classList.remove('hidden');
      }

      async function refreshMonitor() {
        setMonitor('', T.checking, '');
        $('shoot').disabled = true;
        const { httpStatus, data } = await call('getMonitorStatus');
        if (httpStatus === 401) {
          requireSignIn();
          setStatus(T.errAuth, 'bad');
          return;
        }
        if (httpStatus !== 200 || !data) {
          setMonitor('bad', T.errNetwork, '');
          return;
        }
        if (data.linked !== true) {
          setMonitor('bad', T.noMonitor, T.noMonitorSub);
          return;
        }
        // ⛔ **2026-09-22 に生存監視をやめた。** 中継は「たぶん生きている」を返さない。
        //    ⇒ ここでも「応答しています」と言わない。**言えるのは連携が在ることだけ。**
        setMonitor('ok', T.linked, T.linkedSub);
        $('shoot').disabled = false;
      }

      function describeFailure(reason) {
        const map = {
          app_not_foreground: T.failForeground,
          camera_unavailable: T.failCamera,
          not_authorized: T.failAuth,
          mail_failed: T.failMail,
          not_entitled: T.failEntitled,
        };
        return T.failPrefix + (map[reason] || T.failOther);
      }

      function requestError(httpStatus, data) {
        const reason = data && data.error;
        if (httpStatus === 401) return T.errAuth;
        if (httpStatus === 404) return T.errNoMonitor;
        if (httpStatus === 409) return T.errNoToken;
        if (httpStatus === 403) return T.errSameDevice;
        if (httpStatus === 429) {
          return reason === 'too_many_per_day' ? T.errRateDay : T.errRateMinute;
        }
        if (httpStatus === 502 || httpStatus === 503) return T.errPush;
        return T.errNetwork;
      }

      async function pollResult(requestId) {
        const deadline = Date.now() + POLL_TIMEOUT_MS;
        while (Date.now() < deadline) {
          await new Promise((resolve) => setTimeout(resolve, POLL_INTERVAL_MS));
          const { httpStatus, data } = await call('getCaptureResult', { requestId });
          if (httpStatus === 401) {
            requireSignIn();
            return { text: T.errAuth, kind: 'bad' };
          }
          if (httpStatus === 410) return { text: T.errExpired, kind: 'warn' };
          if (httpStatus !== 200 || !data) continue;
          if (data.status === 'captured') return { text: T.captured, kind: 'ok' };
          if (data.status === 'captured_pending_send') {
            return { text: T.capturedPending, kind: 'warn' };
          }
          if (data.status === 'failed') {
            return { text: describeFailure(data.reason), kind: 'bad' };
          }
          // status === 'sent' ＝ まだ届いていない。待つ。
        }
        return { text: T.timeout, kind: 'bad' };
      }

      async function shoot() {
        if (polling) return;
        polling = true;
        $('shoot').disabled = true;
        setStatus(T.sending, '');
        const { httpStatus, data } = await call('requestCapture');
        if (httpStatus !== 200 || !data || !data.requestId) {
          if (httpStatus === 401) requireSignIn();
          setStatus(requestError(httpStatus, data), 'bad');
          polling = false;
          $('shoot').disabled = false;
          return;
        }
        setStatus(T.waiting, '');
        const result = await pollResult(data.requestId);
        setStatus(result.text, result.kind);
        polling = false;
        $('shoot').disabled = false;
        refreshMonitor();
      }

      /** ⛔ ID トークンの中身は読むだけ。署名の検証は中継がやる。 */
      function emailFromToken(token) {
        try {
          const part = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
          const payload = JSON.parse(decodeURIComponent(escape(atob(part))));
          return payload.email || null;
        } catch (error) {
          return null;
        }
      }

      function onCredential(response) {
        idToken = response.credential;
        email = emailFromToken(idToken);
        $('who').textContent = T.signedAs.replace('{email}', email || '');
        $('signin-card').classList.add('hidden');
        $('app-card').classList.remove('hidden');
        setStatus('', '');
        refreshMonitor();
      }

      function initGoogle() {
        if (!window.google || !google.accounts || !google.accounts.id) {
          setTimeout(initGoogle, 200);
          return;
        }
        google.accounts.id.initialize({
          client_id: CLIENT_ID,
          callback: onCredential,
          auto_select: false,
        });
        google.accounts.id.renderButton($('gbtn'), {
          theme: 'filled_black',
          size: 'large',
          shape: 'pill',
          text: 'signin_with',
        });
      }

      $('lang').addEventListener('change', (event) => {
        lang = event.target.value;
        applyLang();
      });
      $('shoot').addEventListener('click', shoot);
      $('signout').addEventListener('click', () => {
        if (window.google && google.accounts && google.accounts.id) {
          google.accounts.id.disableAutoSelect();
        }
        requireSignIn();
        setStatus('', '');
      });

      applyLang();
      initGoogle();
    </script>
  </body>
</html>
